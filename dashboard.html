<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parley Negotiation Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Section 2AQ (2026-09-05): re-palette to match index.html's redesign
     (Section 2AP) -- warm cream page, WHITE cards. See negotiate.html's
     :root comment (Section 2AQ) for the full rationale; same token set
     here. */
  :root {
    --bg: #F8F5EC;
    --text: #14140F;
    --muted: #6B685D;
    --border: #E4E0D2;
    --card-bg: #FFFFFF;
    --card-text: #14140F;
    --card-muted: #6B685D;
    --card-border: #E4E0D2;
    --btn-bg: #14140F;
    --btn-text: #F8F5EC;
    --accent: #C6F135;
    --accent-ink: #2B3300;
    --green-bg: #dcfce7; --green-text: #166534;
    --red-bg: #fee2e2; --red-text: #991b1b;
    --amber-bg: #fef3c7; --amber-text: #92400e;
    --gray-bg: #EDEAE0; --gray-text: #6B685D;
    --font-heading: "DM Serif Display", Georgia, serif;
    --font-body: "Inter", -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px; background: var(--bg); color: var(--text);
    font-family: var(--font-body);
  }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; flex-wrap: wrap; gap: 8px; }
  h1 { margin: 0; font-size: 22px; font-family: var(--font-heading); font-weight: 400; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 4px 0 0 0; }
  .nav-links { display: flex; gap: 8px; }
  a.nav-link {
    color: var(--btn-text); text-decoration: none; font-size: 13px; font-weight: 600;
    border: none; padding: 7px 14px; border-radius: 9px; background: var(--btn-bg);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.nav-link:hover { box-shadow: 0 6px 16px rgba(20,20,15,0.18); transform: translateY(-1px); }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green-text); margin-right: 5px; vertical-align: 1px;
    animation: pulse 2s ease-in-out infinite;
  }
  .live-dot.stale { background: var(--red-text); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 16px 18px; color: var(--card-text);
  }
  .stat-label { font-size: 12px; color: var(--card-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-value { font-size: 24px; font-weight: 600; margin-top: 6px; }
  .table-scroll {
    overflow-x: auto; background: var(--card-bg); color: var(--card-text);
    border: 1px solid var(--card-border); border-radius: 12px;
  }
  table {
    width: 100%; min-width: 560px; border-collapse: collapse;
  }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--card-border); font-size: 14px; }
  /* Was a white wash meant to LIGHTEN a dark table header row (Section
     2AL); cards are white again now, so this flips to a dark wash to
     DARKEN the header row slightly instead, for the same subtle
     row-distinction purpose. */
  th { background: rgba(20,20,15,0.03); font-size: 12px; text-transform: uppercase; color: var(--card-muted); letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--card-muted); }
  td.empty { text-align: center; color: var(--card-muted); padding: 24px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .outcome-accepted { background: var(--green-bg); color: var(--green-text); }
  .outcome-rejected { background: var(--red-bg); color: var(--red-text); }
  .outcome-rolledback { background: var(--amber-bg); color: var(--amber-text); }
  .outcome-other { background: var(--gray-bg); color: var(--gray-text); }
  h2 { font-size: 16px; margin: 0 0 12px 0; font-family: var(--font-heading); font-weight: 400; color: var(--text); }
  .note { font-size: 12px; color: var(--muted); margin: 10px 2px 0 2px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  .error-banner {
    background: var(--red-bg); color: var(--red-text); border-radius: 8px; padding: 10px 14px;
    font-size: 13px; margin-bottom: 20px; display: none;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Parley Negotiation Dashboard</h1>
      <p class="subtitle" id="subtitle"><span class="live-dot" id="live-dot"></span>Loading…</p>
    </div>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="frontend/negotiate.html">Negotiate</a>
      <a class="nav-link" href="frontend/inventory.html">View Inventory &rarr;</a>
    </div>
  </header>

  <div class="error-banner" id="error-banner"></div>

  <div class="stats" id="stats"></div>
  <div id="other-note"></div>
  <div id="excluded-note"></div>

  <h2>By Merchant</h2>
  <div class="table-scroll">
    <table>
      <thead>
        <tr><th>Merchant</th><th>Total</th><th>Accepted</th><th>Rejected</th><th>Rolled back</th><th>Avg discount</th><th>Revenue</th></tr>
      </thead>
      <tbody id="merchant-rows"></tbody>
    </table>
  </div>

  <h2 style="margin-top: 32px;">Recent Negotiations</h2>
  <div class="table-scroll">
    <table>
      <thead>
        <tr><th>Negotiation ID</th><th>Product</th><th>Merchant</th><th>Final price</th><th>Outcome</th></tr>
      </thead>
      <tbody id="recent-rows"></tbody>
    </table>
  </div>

  <footer id="footer">Live from GET /api/dashboard-data &middot; refreshes every 30s</footer>

<script>
// Section 2Z (2026-09-05): this page used to be a static file, fully
// regenerated by scripts/generate_dashboard.py every time you wanted
// fresh numbers -- every value below was baked in as a literal string at
// generation time. It's now live: this script fetches the SAME
// aggregation (src.dashboard.compute_dashboard_data(), shared with that
// script -- one computation, not two) from GET /api/dashboard-data on
// load and every 30 seconds, so new negotiations run through
// frontend/index.html show up here without anyone re-running anything.
// scripts/generate_dashboard.py itself is unchanged and still works
// standalone -- run it if you want a one-shot static snapshot (e.g. no
// API server running, or to email/archive a point-in-time HTML file);
// it will overwrite this file with a plain, non-live version when you
// do, which is the deliberate fallback behavior.
const API_BASE = "http://localhost:8000";
const REFRESH_MS = 30000;

const el = (id) => document.getElementById(id);
const errorBanner = el("error-banner");
const liveDot = el("live-dot");

const UNKNOWN_MERCHANT_LABEL = "Unknown / no merchant";

function fmtPrice(value, currency) {
  if (value === null || value === undefined) return "—";
  const prefix = currency ? `${currency} ` : "";
  return prefix + Number(value).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtPct(value) {
  return (value === null || value === undefined) ? "—" : `${Number(value).toFixed(1)}%`;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

const OUTCOME_CSS_CLASS = {
  "Accepted": "outcome-accepted",
  "Rejected": "outcome-rejected",
  "Rolled back": "outcome-rolledback",
};

function renderStats(stats) {
  const cards = [
    ["Total negotiations", stats.total_negotiations],
    ["Accepted", stats.accepted],
    ["Rejected", stats.rejected],
    ["Rolled back", stats.rolled_back],
    ["Avg rounds", stats.avg_rounds],
    ["Avg discount", fmtPct(stats.avg_discount_pct)],
    ["Total revenue", fmtPrice(stats.total_revenue, stats.currency)],
  ];
  el("stats").innerHTML = cards.map(([label, value]) =>
    `<div class="stat-card"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value">${escapeHtml(String(value))}</div></div>`
  ).join("");
}

function renderNotes(stats, meta) {
  el("other-note").innerHTML = stats.other
    ? `<p class="note">${stats.other} negotiation(s) had an outcome other than Accepted/Rejected/Rolled back (e.g. approval declined or incomplete) and are excluded from the three counts above but included in avg rounds.</p>`
    : "";
  const ungrouped = meta.ungrouped_count;
  el("excluded-note").innerHTML = ungrouped
    ? `<p class="note">${ungrouped} log entr${ungrouped === 1 ? "y" : "ies"} had no negotiation_id (pre-Milestone-7 data) and could not be attributed to a specific negotiation, so they are excluded from every stat and table row on this page.</p>`
    : "";
}

function renderMerchantTable(merchantBreakdown) {
  const rows = merchantBreakdown.map(m => `
    <tr>
      <td>${escapeHtml(m.merchant_name)}</td>
      <td class="num">${m.total_negotiations}</td>
      <td class="num">${m.accepted}</td>
      <td class="num">${m.rejected}</td>
      <td class="num">${m.rolled_back}</td>
      <td class="num">${escapeHtml(fmtPct(m.avg_discount_pct))}</td>
      <td class="num">${escapeHtml(fmtPrice(m.total_revenue, m.currency))}</td>
    </tr>`).join("");
  el("merchant-rows").innerHTML = rows || '<tr><td colspan="7" class="empty">No negotiations found.</td></tr>';
}

function renderRecentTable(recent, merchantNames) {
  const rows = recent.map(s => {
    const cssClass = OUTCOME_CSS_CLASS[s.outcome] || "outcome-other";
    const merchantLabel = s.merchant_id ? (merchantNames[s.merchant_id] || s.merchant_id) : UNKNOWN_MERCHANT_LABEL;
    return `
    <tr>
      <td class="mono" title="${escapeHtml(s.negotiation_id)}">${escapeHtml(s.negotiation_id.slice(0, 12))}…</td>
      <td>${escapeHtml(s.product_name || "—")}</td>
      <td>${escapeHtml(merchantLabel)}</td>
      <td class="num">${escapeHtml(fmtPrice(s.final_price, s.currency))}</td>
      <td><span class="badge ${cssClass}">${escapeHtml(s.outcome)}</span></td>
    </tr>`;
  }).join("");
  el("recent-rows").innerHTML = rows || '<tr><td colspan="5" class="empty">No negotiations found.</td></tr>';
}

function renderDashboard(data) {
  const { stats, merchant_breakdown, recent, merchant_names, meta } = data;
  renderStats(stats);
  renderNotes(stats, meta);
  renderMerchantTable(merchant_breakdown);
  renderRecentTable(recent, merchant_names);

  const sourcesText = Object.entries(meta.source_counts).map(([p, n]) => `${p} (${n} entries)`).join(", ");
  el("subtitle").innerHTML =
    `<span class="live-dot" id="live-dot"></span>Live from ${escapeHtml(sourcesText)}. ${stats.total_negotiations} negotiations grouped by negotiation_id.`;
  el("footer").textContent = `Live from GET /api/dashboard-data · last refreshed ${meta.generated_at} · refreshes every 30s`;
}

function setLiveDotStale(isStale) {
  const dot = el("live-dot");
  if (dot) dot.className = "live-dot" + (isStale ? " stale" : "");
}

async function loadDashboard() {
  try {
    const resp = await fetch(`${API_BASE}/api/dashboard-data`);
    if (!resp.ok) throw new Error(`${resp.status}: ${resp.statusText}`);
    const data = await resp.json();
    renderDashboard(data);
    errorBanner.style.display = "none";
    setLiveDotStale(false);
  } catch (e) {
    errorBanner.textContent =
      "Could not load live dashboard data: " + e.message + " -- is the API running (uvicorn src.api:app --port 8000)? " +
      "Showing the last successfully loaded data, if any; falling back to scripts/generate_dashboard.py gives a static snapshot instead.";
    errorBanner.style.display = "block";
    setLiveDotStale(true);
  }
}

loadDashboard();
setInterval(loadDashboard, REFRESH_MS);
</script>
</body>
</html>
